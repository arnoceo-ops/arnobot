name: Issue-melding

# Waarom dit bestaat: de cloud-routines (maandcheck, ACTIE-meldingen, key-reminders)
# maken issues aan onder Arno's eigen GitHub-account. GitHub mailt en meldt je niet
# over je eigen acties (getest 2026-10-12: ook geen web-melding, zelfs niet met een
# @-comment van github-actions[bot]). Daarom stuurt deze workflow zelf een Telegram-
# bericht via dezelfde bot als lib/cron-notify.ts.
#
# Vereist twee repo-secrets (Settings, Secrets and variables, Actions):
# TELEGRAM_BOT_TOKEN en TELEGRAM_CHAT_ID, dezelfde waarden als in Vercel.
#
# Veiligheid: alleen metadata, geen checkout, geen PR-code. Alleen issues die door de
# eigenaar zelf zijn aangemaakt en een bekende titelprefix hebben. Titel gaat via een
# env-variabele (niet in het script geinterpoleerd) tegen injectie.

on:
  issues:
    types: [opened]

permissions:
  issues: read

jobs:
  melding:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'ArnoBot maandcheck') ||
       startsWith(github.event.issue.title, 'ACTIE') ||
       startsWith(github.event.issue.title, 'Reminder') ||
       startsWith(github.event.issue.title, 'TEST'))
    steps:
      - name: Stuur Telegram-bericht
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Secrets TELEGRAM_BOT_TOKEN en/of TELEGRAM_CHAT_ID ontbreken in de repo."; exit 1
          fi
          # Whitespace en quotes weghalen: een plakfout in het secret (spatie, regeleinde,
          # aanhalingstekens) gaf anders een 400 van Telegram.
          TG_TOKEN=$(printf '%s' "$TG_TOKEN" | tr -d '[:space:]"'"'")
          TG_CHAT=$(printf '%s' "$TG_CHAT" | tr -d '[:space:]"'"'")
          TEXT=$(printf 'Nieuwe routine-melding op GitHub\n\n%s\n%s' "$TITLE" "$URL")
          RESP=$(curl -sS -w '\n%{http_code}' "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}")
          CODE=$(tail -n1 <<<"$RESP")
          if [ "$CODE" != "200" ]; then
            echo "Telegram gaf HTTP $CODE: $(head -n -1 <<<"$RESP")"; exit 1
          fi
          echo "Telegram-bericht verstuurd."
