name: Issue-melding

# Waarom dit bestaat: de cloud-routines (maandcheck, ACTIE-meldingen, key-reminders)
# maken issues aan onder Arno's eigen GitHub-account. GitHub mailt je niet over je
# eigen acties, dus een routine-issue gaf geen mail (getest 2026-10-12). Een comment
# van github-actions[bot] met een @-vermelding is niet Arno's eigen actie en geeft
# wel een melding via "Participating, @mentions".
#
# Veiligheid: alleen metadata, geen checkout, geen PR-code. Alleen issues die door de
# eigenaar zelf zijn aangemaakt en een bekende titelprefix hebben.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  melding:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'ArnoBot maandcheck') ||
       startsWith(github.event.issue.title, 'ACTIE') ||
       startsWith(github.event.issue.title, 'Reminder') ||
       startsWith(github.event.issue.title, 'TEST'))
    steps:
      - name: Plaats melding met mention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api "repos/$REPO/issues/$ISSUE/comments" \
            -f body="@$OWNER nieuwe melding van een routine, zie dit issue."
