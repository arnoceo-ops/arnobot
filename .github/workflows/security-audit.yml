name: Security Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Elke maandag om 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (hoog + kritiek)
        run: npm audit --audit-level=high --production
        # --production: alleen runtime-pakketten, geen build-tools
        # --audit-level=high: build faalt bij high of critical, niet bij moderate
