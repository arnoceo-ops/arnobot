name: Security Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Elke maandag om 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (kritiek)
        run: npm audit --audit-level=critical --omit=dev
        # --audit-level=critical: alleen bij kritieke kwetsbaarheden in runtime-code
        # --omit=dev: sluit devDependencies uit
        # Toelichting: high-severity meldingen in @sanity/cli en Next.js bundled postcss
        # zijn build-tool false positives die nooit in productie draaien.
