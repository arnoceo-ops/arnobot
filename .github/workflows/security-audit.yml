name: Security Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Elke maandag om 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (kritiek)
        run: npm audit --audit-level=critical --omit=dev
        # --audit-level=critical: alleen bij kritieke kwetsbaarheden in runtime-code
        # --omit=dev: sluit devDependencies uit
        # Toelichting: high-severity meldingen in @sanity/cli en Next.js bundled postcss
        # zijn build-tool false positives die nooit in productie draaien.

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
        # Vercel's next build faalt ook al op typefouten vóór deploy; dit geeft
        # sneller feedback direct in de PR in plaats van te wachten op de preview.

  lint:
    name: ESLint (informatief, blokkeert niet)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (volledige codebase)
        run: npm run lint
        continue-on-error: true
        # Blokkeert bewust niet: er staan nog 66 bestaande lint-fouten in
        # oudere code (2026-07-10 gemeten). Twee pogingen om alleen nieuwe/
        # gewijzigde regels te laten falen (eigen git-diff-script, daarna
        # reviewdog/action-eslint met filter_mode: added) faalden allebei in
        # de praktijk op deze repo, filter_mode: added bleek de hele codebase
        # te scannen in plaats van alleen de diff, ook met checks:write
        # rechten. Output blijft zichtbaar in de Actions-log. Opruimen van de
        # 66 bestaande fouten is een apart, later op te pakken project.
