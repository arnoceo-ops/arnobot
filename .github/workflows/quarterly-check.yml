name: Maandelijkse check

on:
  schedule:
    # Elke 1e van de maand om 08:00 UTC
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  create-issue:
    name: Maak kwartaalcheck issue aan
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Maak kwartaalcheck issue aan
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date()
            const month = now.getMonth() + 1
            const year = now.getFullYear()
            const maanden = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec']
            const maand = maanden[month - 1]

            const body = [
              '## Maandelijkse check ' + maand + ' ' + year,
              '',
              'Stuur dit issue door naar Claude Code met: doe de kwartaalcheck',
              '',
              'De volledige, actuele checklist staat in CLAUDE.md (sectie "Maandelijkse check"), niet hier gedupliceerd. Dat voorkomt dat deze issue-tekst en CLAUDE.md uit elkaar groeien. Claude loopt bij het aanroepen van de kwartaalcheck alle rubrieken uit CLAUDE.md na en rapporteert per punt.',
              '',
              'Aangemaakt door de automatische maandelijkse check workflow.',
            ].join('\n')

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Maandelijkse check ' + maand + ' ' + year + ' - ArnoBot',
              body: body,
            })
