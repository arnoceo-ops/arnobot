version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    groups:
      # Kleine updates samen in één PR
      patch-updates:
        update-types:
          - "patch"
    ignore:
      # Sanity net geüpgraded naar v6 — major updates handmatig beoordelen
      - dependency-name: "sanity"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sanity/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next-sanity"
        update-types: ["version-update:semver-major"]
